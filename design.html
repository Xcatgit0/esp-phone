<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Vector & AABB Designer (Binary Edition)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        canvas { background: #000; border: 1px solid #555; cursor: crosshair; }
        .toolbar, .file-toolbar { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;}
        button, select, input { padding: 5px; cursor: pointer; }
        textarea { width: 100%; height: 70px; margin-top: 5px; background: #333; color: #0f0; font-family: monospace; }
        .divider { width: 2px; height: 20px; background: #555; margin: 0 5px; }
        .box-title { margin: 15px 0 5px 0; font-weight: bold; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="toolbar">
        <select id="tool">
            <option value="1">Line</option>
            <option value="2">Rectangle (Outline)</option>
            <option value="3">Rectangle (Filled)</option>
            <option value="4">Circle (Outline)</option>
            <option value="5">Circle (Filled)</option>
            <option value="6">AABB Hitbox</option>
        </select>
        <input type="color" id="color" value="#ffffff" title="เลือกสี">
        <input type="number" id="aabb_id" placeholder="AABB ID (0-255)" value="1" min="0" max="255" style="width: 100px;">
        <button onclick="clearCanvas()" style="background: #a33; color: white; border: none;">Clear</button>
    </div>

    <div class="file-toolbar">
        <button onclick="loadFromLuaTextarea()">Load from Lua String</button>
        <button onclick="loadFromRawTextarea()">Load from Raw Chars</button>
        <div class="divider"></div>
        <button onclick="saveToBinaryFile()" style="background: #2a2; color: white; border: none;">Save to .bin File (แนะนำ)</button>
        <input type="file" id="fileInput" accept=".bin" onchange="loadBinaryFile(event)" style="display: none;">
        <button onclick="document.getElementById('fileInput').click()" style="background: #27a; color: white; border: none;">Load .bin File</button>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="box-title">1. Lua Escape String (ปลอดภัยสำหรับการ Copy ไปวางในโค้ด .lua):</div>
    <textarea id="output_lua" placeholder="\x56\x47\x31..."></textarea>

    <div class="box-title">2. Raw Characters (ตัว Byte จริงๆ สำหรับ Copy ไปลงไฟล์แยก):</div>
    <textarea id="output_raw" placeholder="VG1..."></textarea>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let shapes = [];
        let isDrawing = false;
        let startX, startY;
        
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; startX = e.offsetX; startY = e.offsetY; });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) { drawAll(); drawPreview(startX, startY, e.offsetX, e.offsetY); } });
        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            let tool = parseInt(document.getElementById('tool').value);
            let color = document.getElementById('color').value;
            let id = parseInt(document.getElementById('aabb_id').value) || 0;
            
            let w = e.offsetX - startX; let h = e.offsetY - startY;
            let r = Math.round(Math.sqrt(w*w + h*h));

            shapes.push({ type: tool, color: color, id: id, x1: startX, y1: startY, x2: e.offsetX, y2: e.offsetY, w: w, h: h, r: r });
            drawAll(); updateUI();
        });

        function drawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            shapes.forEach(s => drawShape(s.type, s.x1, s.y1, s.x2, s.y2, s.w, s.h, s.r, s.color, s.id));
        }

        function drawPreview(x1, y1, x2, y2) {
            let tool = parseInt(document.getElementById('tool').value);
            let w = x2 - x1; let h = y2 - y1;
            drawShape(tool, x1, y1, x2, y2, w, h, Math.round(Math.sqrt(w*w + h*h)), document.getElementById('color').value, 0);
        }

        function drawShape(type, x1, y1, x2, y2, w, h, r, color, id) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1; ctx.beginPath();
            let rx = w < 0 ? x2 : x1; let ry = h < 0 ? y2 : y1;
            let aw = Math.abs(w); let ah = Math.abs(h);
            if (type === 1) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
            else if (type === 2) { ctx.strokeRect(rx, ry, aw, ah); }
            else if (type === 3) { ctx.fillRect(rx, ry, aw, ah); }
            else if (type === 4) { ctx.arc(x1, y1, r, 0, Math.PI * 2); ctx.stroke(); }
            else if (type === 5) { ctx.arc(x1, y1, r, 0, Math.PI * 2); ctx.fill(); }
            else if (type === 6) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.setLineDash([5, 5]);
                ctx.strokeRect(rx, ry, aw, ah);
                ctx.fillStyle = 'red'; ctx.fillText(`ID:${id}`, rx, ry - 5); ctx.setLineDash([]);
            }
        }

        function clearCanvas() { shapes = []; drawAll(); updateUI(); }

        function rgbTo565(hex) {
            let r = parseInt(hex.substring(1, 3), 16), g = parseInt(hex.substring(3, 5), 16), b = parseInt(hex.substring(5, 7), 16);
            return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
        }
        function rgb565ToHex(c565) {
            let r = Math.round(((c565 >> 11) & 0x1F) * 255 / 31), g = Math.round(((c565 >> 5) & 0x3F) * 255 / 63), b = Math.round((c565 & 0x1F) * 255 / 31);
            return "#" + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
        }

        function buildBinary() {
            let buffer = new ArrayBuffer(65536); // Max 64KB
            let view = new DataView(buffer);
            let offset = 0;

            view.setUint8(offset++, 0x56); view.setUint8(offset++, 0x47); view.setUint8(offset++, 0x31);

            shapes.forEach(s => {
                view.setUint8(offset++, s.type);
                let c565 = rgbTo565(s.color);
                let rx = s.w < 0 ? s.x2 : s.x1; let ry = s.h < 0 ? s.y2 : s.y1;
                let aw = Math.abs(s.w); let ah = Math.abs(s.h);

                if (s.type === 1) { 
                    view.setInt16(offset, s.x1, true); view.setInt16(offset+2, s.y1, true);
                    view.setInt16(offset+4, s.x2, true); view.setInt16(offset+6, s.y2, true);
                    view.setUint16(offset+8, c565, true); offset += 10;
                } else if (s.type === 2 || s.type === 3) { 
                    view.setInt16(offset, rx, true); view.setInt16(offset+2, ry, true);
                    view.setUint16(offset+4, aw, true); view.setUint16(offset+6, ah, true);
                    view.setUint16(offset+8, c565, true); offset += 10;
                } else if (s.type === 4 || s.type === 5) { 
                    view.setInt16(offset, s.x1, true); view.setInt16(offset+2, s.y1, true);
                    view.setUint16(offset+4, s.r, true); view.setUint16(offset+6, c565, true); offset += 8;
                } else if (s.type === 6) { 
                    view.setUint8(offset++, s.id);
                    view.setInt16(offset, rx, true); view.setInt16(offset+2, ry, true);
                    view.setUint16(offset+4, aw, true); view.setUint16(offset+6, ah, true); offset += 8;
                }
            });
            return new Uint8Array(buffer, 0, offset);
        }

        function updateUI() {
            let bytes = buildBinary();
            let luaStr = "";
            let rawStr = "";
            for (let i = 0; i < bytes.length; i++) {
                luaStr += "\\x" + bytes[i].toString(16).padStart(2, '0').toUpperCase();
                rawStr += String.fromCharCode(bytes[i]); // สร้างเป็นอักขระดิบ (Raw Byte String)
            }
            document.getElementById('output_lua').value = luaStr;
            document.getElementById('output_raw').value = rawStr;
        }

        function saveToBinaryFile() {
            let bytes = buildBinary();
            if (bytes.length <= 3) return;
            const blob = new Blob([bytes], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "sprite.bin"; a.click();
            URL.revokeObjectURL(url);
        }

        function parseBinary(bytes) {
            let view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            if (view.byteLength < 3 || view.getUint8(0) !== 0x56 || view.getUint8(1) !== 0x47 || view.getUint8(2) !== 0x31) {
                alert("Invalid Binary Data!"); return;
            }
            shapes = [];
            let offset = 3;
            while (offset < view.byteLength) {
                let type = view.getUint8(offset++);
                if (type === 1) {
                    let x1 = view.getInt16(offset, true); let y1 = view.getInt16(offset+2, true);
                    let x2 = view.getInt16(offset+4, true); let y2 = view.getInt16(offset+6, true);
                    let color = rgb565ToHex(view.getUint16(offset+8, true)); offset += 10;
                    shapes.push({ type: type, color: color, id: 0, x1: x1, y1: y1, x2: x2, y2: y2, w: x2-x1, h: y2-y1, r: 0 });
                } else if (type === 2 || type === 3) {
                    let x = view.getInt16(offset, true); let y = view.getInt16(offset+2, true);
                    let w = view.getUint16(offset+4, true); let h = view.getUint16(offset+6, true);
                    let color = rgb565ToHex(view.getUint16(offset+8, true)); offset += 10;
                    shapes.push({ type: type, color: color, id: 0, x1: x, y1: y, x2: x+w, y2: y+h, w: w, h: h, r: 0 });
                } else if (type === 4 || type === 5) {
                    let x = view.getInt16(offset, true); let y = view.getInt16(offset+2, true);
                    let r = view.getUint16(offset+4, true); let color = rgb565ToHex(view.getUint16(offset+6, true)); offset += 8;
                    shapes.push({ type: type, color: color, id: 0, x1: x, y1: y, x2: x, y2: y, w: 0, h: 0, r: r });
                } else if (type === 6) {
                    let id = view.getUint8(offset++);
                    let x = view.getInt16(offset, true); let y = view.getInt16(offset+2, true);
                    let w = view.getUint16(offset+4, true); let h = view.getUint16(offset+6, true); offset += 8;
                    shapes.push({ type: type, color: "#ff0000", id: id, x1: x, y1: y, x2: x+w, y2: y+h, w: w, h: h, r: 0 });
                } else break;
            }
            drawAll(); updateUI();
        }

        function loadBinaryFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { parseBinary(new Uint8Array(e.target.result)); event.target.value = ''; };
            reader.readAsArrayBuffer(file);
        }

        function loadFromLuaTextarea() {
            let str = document.getElementById('output_lua').value.replace(/\\x/g, '');
            if (str.length % 2 !== 0) { alert("Invalid Lua escape string"); return; }
            let bytes = new Uint8Array(str.length / 2);
            for (let i = 0; i < str.length; i += 2) bytes[i/2] = parseInt(str.substring(i, i+2), 16);
            parseBinary(bytes);
        }

        function loadFromRawTextarea() {
            let str = document.getElementById('output_raw').value;
            let bytes = new Uint8Array(str.length);
            for(let i=0; i<str.length; i++) bytes[i] = str.charCodeAt(i) & 0xFF;
            parseBinary(bytes);
        }
    </script>
</body>
</html>
