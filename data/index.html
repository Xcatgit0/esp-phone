<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP-PHONE</title>
    <style>
        :root {
            --bg: #eef2ee;
            --panel: #ffffff;
            --ink: #16231d;
            --muted: #5c6b63;
            --line: #d3dcd5;
            --board: #0f5a45;
            --board-ink: #eafff5;
            --copper: #b8732a;
            --ok: #1c7a4b;
            --err: #b3372e;
            --code-bg: #14211b;
            --code-ink: #cfeedd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1511;
                --panel: #15211b;
                --ink: #e4f0e9;
                --muted: #8fa398;
                --line: #263a30;
                --board: #1d8a68;
                --board-ink: #04130d;
                --copper: #e2a15c;
                --ok: #5fd19a;
                --err: #ff8a80;
                --code-bg: #0a110d;
                --code-ink: #b9e6cf;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px 48px;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 520px;
            margin: 0 auto;
            display: grid;
            gap: 16px;
        }

        header {
            background: var(--board);
            color: var(--board-ink);
            border-radius: 14px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: .02em;
        }

        header p {
            margin: 2px 0 0;
            font-size: .85rem;
            opacity: .8;
        }

        .pad {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--copper);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, .15);
            flex: none;
        }

        section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 18px 20px;
        }

        h2 {
            margin: 0 0 4px;
            font-size: 1.05rem;
        }

        .hint {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: .9rem;
        }

        /* command box */
        .cmd {
            display: flex;
            align-items: stretch;
            background: var(--code-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .cmd code {
            flex: 1;
            padding: 12px 14px;
            color: var(--code-ink);
            font: .82rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow-x: auto;
            white-space: nowrap;
        }

        /* buttons */
        button {
            font: inherit;
            font-weight: 600;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            transition: transform .08s, filter .15s, background .15s;
        }

        button:hover:not(:disabled) { filter: brightness(1.08); }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: .45; cursor: not-allowed; }

        :focus-visible {
            outline: 3px solid var(--copper);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--board);
            color: var(--board-ink);
            width: 100%;
            margin-top: 14px;
        }

        .btn-copy {
            background: transparent;
            color: var(--code-ink);
            border-left: 1px solid rgba(255, 255, 255, .12);
            border-radius: 0;
            padding: 0 16px;
            font-size: .85rem;
        }

        .btn-danger {
            background: transparent;
            color: var(--err);
            border: 1.5px solid var(--err);
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--err);
            color: var(--panel);
            filter: none;
        }

        /* file drop zone */
        .drop {
            display: block;
            border: 2px dashed var(--line);
            border-radius: 10px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .drop:hover,
        .drop.over,
        .drop:focus-within {
            border-color: var(--copper);
            background: color-mix(in srgb, var(--copper) 8%, transparent);
        }

        .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .drop strong { display: block; }
        .drop span { color: var(--muted); font-size: .88rem; }
        .drop.has-file { border-style: solid; border-color: var(--board); }

        /* progress */
        progress {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            margin-top: 16px;
            border: 0;
            border-radius: 99px;
            overflow: hidden;
            background: var(--line);
        }

        progress::-webkit-progress-bar { background: var(--line); }
        progress::-webkit-progress-value { background: var(--board); transition: width .2s; }
        progress::-moz-progress-bar { background: var(--board); }

        #status {
            display: block;
            min-height: 1.5em;
            margin-top: 8px;
            font-size: .9rem;
            color: var(--muted);
        }

        #status.ok { color: var(--ok); }
        #status.err { color: var(--err); }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .row .hint { margin: 0; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>ESP32</h1>
                <p>ESP-PHONE control page</p>
            </div>
            <span class="pad" aria-hidden="true"></span>
        </header>

        <section>
            <h2>Upload storage.bin</h2>
            <p class="hint">Choose a .bin file and send it to the device over Wi-Fi.</p>

            <label class="drop" id="drop">
                <input id="file" type="file" accept=".bin">
                <strong id="fileName">Choose a .bin file</strong>
                <span id="fileMeta">or drop it here</span>
            </label>

            <button id="upload" class="btn-primary" disabled>Upload</button>
            <progress id="progress" value="0" max="100"></progress>
            <span id="status" role="status"></span>
        </section>

        <section>
            <h2>OTA POST from the terminal</h2>
            <p class="hint">Or send the file with curl.</p>
            <div class="cmd">
                <code id="g"></code>
                <button id="copy" class="btn-copy" type="button">Copy</button>
            </div>
        </section>

        <section class="row">
            <div>
                <h2>Restart</h2>
                <p class="hint">Reboot the ESP32.</p>
            </div>
            <button class="btn-danger" onclick="reset()">Restart</button>
        </section>
    </main>

    <script>
        const g = document.getElementById("g");
        const cmd = `curl -X POST --data-binary @storage.bin http://${window.location.host}/api/ota/storage`;
        g.innerText = cmd;

        function reset() {
            fetch("/restart");
        }

        document.getElementById("copy").onclick = async (e) => {
            const btn = e.currentTarget;
            try {
                await navigator.clipboard.writeText(cmd);
                btn.textContent = "Copied";
            } catch {
                const r = document.createRange();
                r.selectNodeContents(g);
                getSelection().removeAllRanges();
                getSelection().addRange(r);
                btn.textContent = "Select and copy";
            }
            setTimeout(() => (btn.textContent = "Copy"), 1500);
        };

        const fileInput = document.getElementById("file");
        const uploadButton = document.getElementById("upload");
        const progress = document.getElementById("progress");
        const status = document.getElementById("status");
        const drop = document.getElementById("drop");
        const fileName = document.getElementById("fileName");
        const fileMeta = document.getElementById("fileMeta");

        function setStatus(text, type = "") {
            status.textContent = text;
            status.className = type;
        }

        function showFile() {
            const file = fileInput.files[0];
            drop.classList.toggle("has-file", !!file);
            uploadButton.disabled = !file;
            if (file) {
                fileName.textContent = file.name;
                fileMeta.textContent = `${(file.size / 1024).toFixed(1)} KB`;
            } else {
                fileName.textContent = "Choose a .bin file";
                fileMeta.textContent = "or drop it here";
            }
        }

        fileInput.onchange = showFile;

        ["dragenter", "dragover"].forEach(ev =>
            drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
        ["dragleave", "drop"].forEach(ev =>
            drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
        drop.addEventListener("drop", e => {
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                showFile();
            }
        });

        uploadButton.onclick = () => {
            const file = fileInput.files[0];

            if (!file) {
                setStatus("Please select a file", "err");
                return;
            }

            setStatus(`Uploading ${file.name}...`);
            progress.value = 0;
            uploadButton.disabled = true;

            // XHR gives real upload progress (fetch does not)
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/api/ota/storage");

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    progress.value = (e.loaded / e.total) * 100;
                    setStatus(`Uploading ${file.name}... ${Math.round(progress.value)}%`);
                }
            };

            xhr.onload = () => {
                uploadButton.disabled = false;
                if (xhr.status < 200 || xhr.status >= 300) {
                    setStatus(`Upload failed: HTTP ${xhr.status}`, "err");
                    return;
                }
                let message = "Upload complete";
                try { message = JSON.parse(xhr.responseText).message || message; } catch { }
                progress.value = 100;
                setStatus(message, "ok");
            };

            xhr.onerror = () => {
                uploadButton.disabled = false;
                setStatus("Upload failed: connection error", "err");
            };

            xhr.send(file);
        };
    </script>
</body>

</html>
